name: Desktop baseline

# Draft PRs skip the matrix; new commits to a ready PR run it again.
# The owner can also start it from Actions via workflow_dispatch.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows/amd64
            runner: windows-2025
            goos: windows
            goarch: amd64
          - target: windows/arm64
            runner: windows-11-arm
            goos: windows
            goarch: arm64
          - target: linux/amd64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - target: linux/arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - target: darwin/amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - target: darwin/arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build core and software renderer
        run: go build . ./software
      - name: Run headless core and software tests
        run: go test . ./software
      - name: Keep Vulkan out of the core and software import graph
        if: matrix.target == 'linux/amd64'
        shell: bash
        run: |
          go list -deps -f '{{.ImportPath}}' . ./software > "$RUNNER_TEMP/software-deps.txt"
          if grep -E '^github.com/banditmoscow1337/(miniVK|nativeForms/vulkan)(/|$)' "$RUNNER_TEMP/software-deps.txt"; then
            echo 'core/software unexpectedly imports Vulkan' >&2
            exit 1
          fi
      - name: Build platform adapters
        run: go build ./platform/...
      - name: Run platform adapter tests
        run: go test ./platform/...
      - name: Build optional Vulkan package
        run: go build ./vulkan
      - name: Build examples and remaining packages
        run: go build ./...


